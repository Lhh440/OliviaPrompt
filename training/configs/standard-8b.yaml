# OliviaPrompt Standard — Qwen3-8B LoRA
#
# ⚠ 状态：配置就绪，待更大显存或上游修复（2026-11 Windows 实测结论）
#
# 为什么 12GB 卡训不了 8B（本机 RTX 4070 实测）：
#   * bf16 全量 LoRA：8B 权重 16GB，显存放不下（4B 用同一配置训练成功）
#   * bnb 4bit：py-spy 证实 backward 走 _dequant_linear_fallback 且与梯度
#     检查点叠加后在 autograd 引擎死锁（Windows + torch 2.5.1）
#   * hqq 0.2.8：LF 0.9.5 传参即崩（device 字符串）
#   * 梯度检查点本身（reentrant 与非 reentrant 都）在 Windows + torch 2.5.1
#     上死锁——4B 关闭检查点后 3 步内即恢复正常训练
# → 在 24GB+ 显存（bf16 无检查点可跑）或上游修复 bnb/hqq 后，本配置可直接使用。
#
# 预期：短 + 中 + 长 全档。与 Lite 同一数据、同一超参，只换基座与导出精度（Q5_K_M）。

### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.1
lora_target: all

### quantization — 无（bf16 全量 LoRA，需 24GB+ 显存；量化方案见上方状态说明）
quantization_bit: null

### dataset
dataset: olivia_prompt_sft
dataset_dir: training/data/out
template: qwen3                # 老版本 LLaMA-Factory 没有该模板时改回 qwen2
cutoff_len: 1536
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: training/out/standard-8b
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

### train（与 lite 同参；无检查点时 batch 1×16，24GB 卡可回 batch 4×4）
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 8.0e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.05
neftune_noise_alpha: 5
bf16: true
gradient_checkpointing: false
packing: false
train_on_prompt: false

### eval
val_size: 0.02
eval_strategy: steps
eval_steps: 200
per_device_eval_batch_size: 2
