# OliviaPrompt Lite — Qwen3-4B LoRA（约 4070 上 25-50 分钟）
# 产品侧承诺档位：短 + 中（长档建议用 standard-8b；本配置的数据包含长档，
# 因为输出是槽位 JSON 而非散文，4B 负担可控，但长档质量仍以 8B 为准）
#
# Windows 实测可用的版本组合（2026-11，RTX 4070 12GB）：
#   torch==2.5.1+cu121（先装！否则 pip 会拉到 CPU 轮子）
#   transformers==4.56.1（5.x 与 peft 0.18 不兼容；4.51 太旧）
#   peft==0.18.1 + bitsandbytes==0.50.2（hqq 0.2.8 与 LF 0.9.5 不兼容，勿用）
#   torchaudio==2.5.1+cu121 torchvision==0.20.1+cu121（LF 无条件 import torchaudio）

### model
model_name_or_path: Qwen/Qwen3-4B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.1
lora_target: all

### quantization — 关闭。Windows 实测结论（RTX 4070 / LF 0.9.5，py-spy 逐次定位）：
### * torch 2.5.1 与 2.7.1 上 backward 均偶发死锁在 autograd 引擎等待点
###   （graph.py:824/825）——与梯度检查点、量化方式、dataloader 配置无关，
###   属驱动/OS 层 CUDA 事件竞态；缓解 = 50 步密集存档 + 停滞 8 分钟自动
###   杀进程续训（scripts 侧 auto_resume.sh），损失上界 50 步 + 11 分钟
### * bnb 4bit 另有 dequant fallback 拖慢问题；hqq 0.2.8 与 LF 0.9.5 不兼容
### 可用路径：bf16 全量 LoRA + batch 1×16（12GB 卡实测 12-15s/it）
quantization_bit: null

### dataset（先运行 training/scripts/train.bat 或 synthesize.py 生成）
dataset: olivia_prompt_sft
dataset_dir: training/data/out
template: qwen3                # 老版本 LLaMA-Factory 没有该模板时改回 qwen2
cutoff_len: 1536               # 输出是槽位 JSON，比散文短一半
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: training/out/lite-4b
logging_steps: 10
save_steps: 50                  # 密集存档：Windows 偶发 autograd 死锁时最多损失 50 步
plot_loss: true
overwrite_output_dir: true

### train（方案 v0.1 第七节统一配置；无检查点 + batch 1×16，等效 batch 16）
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 8.0e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.05
neftune_noise_alpha: 5
bf16: true
gradient_checkpointing: false   # 实验 E1：排除 checkpointing 死锁因素（显存代价：batch 1）
dataloader_num_workers: 0
dataloader_pin_memory: false
packing: false
train_on_prompt: false

### eval
val_size: 0.02
eval_strategy: steps
eval_steps: 200
per_device_eval_batch_size: 4
